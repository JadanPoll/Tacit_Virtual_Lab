name: A40 teaching model tests
on:
  push:
    paths:
      - "models/**"
      - "robotics.html"
      - "index.html"
      - "gpu-investigation.html"
      - "locks.html"
      - "llm.html"
      - ".github/workflows/a40-model.yml"
  pull_request:
    paths:
      - "models/**"
      - ".github/workflows/a40-model.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings
        run: gcc -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror models/a40_model.c -lm -o models/a40_model
      - name: Parameterized end-to-end and conceptual tests
        run: python3 models/test_a40.py
      - name: Virtual GPU kernel transaction and correctness tests
        run: node models/gpu-virtual.test.cjs
      - name: Browser script syntax and navigation smoke
        run: node models/browser-smoke.test.cjs
      - name: Virtual lock scheduler exhaustive tests
        run: node models/lock-lab.test.cjs
      - name: Robotics mathematics and mission acceptance tests
        run: node --test models/robotics_math.test.mjs
      - name: Sanitizer smoke with multiple SMs and warps
        run: |
          gcc -O1 -g -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer models/a40_model.c -lm -o models/a40_san
          ASAN_OPTIONS=detect_leaks=1 models/a40_san --sms 2 --warps 3 --instructions 128 --workload mixed --pattern 5 --quiet >/dev/null
