name: GDB Linux incidents
on:
  push:
    paths:
      - 'gdb/**'
      - '.github/workflows/gdb-lab.yml'
  pull_request:
    paths:
      - 'gdb/**'
      - '.github/workflows/gdb-lab.yml'
  workflow_dispatch:

jobs:
  incidents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GDB is present
        run: command -v gdb || (sudo apt-get update -qq && sudo apt-get install -y gdb)
      - name: Compile, exercise incidents, and run GDB checks
        run: GDB_REQUIRED=1 python3 gdb/test_incidents.py
